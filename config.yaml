# =============================================================================
# Road Defect Detection Pipeline — configuration
# Every stage reads from this file. Paths are relative to the repo root unless
# absolute. Anything you change here changes pipeline behaviour; no code edits.
#
# Pipeline order:
#   ingest -> viewpoint -> reproject -> quality -> sampling -> scale
#          -> inference (ROAD SEGMENTATION -> SURFACE CONDITION -> detect/track)
#          -> severity -> report
# =============================================================================

run:
  name: "default"            # used in output subdir + manifest
  seed: 1337
  device: "auto"             # auto | cuda | cuda:0 | cpu
  output_dir: "out"          # per-run artifacts go to <output_dir>/<run.name>/

# ---------------------------------------------------------------------------
# 0. VIEWPOINT — what camera shot this, which decides nearly everything else
# ---------------------------------------------------------------------------
view:
  # car_360     : 360 equirectangular from a survey vehicle -> needs v360 flattening
  # car_flat    : ordinary forward-facing vehicle camera    -> no flattening
  # drone_nadir : drone pointing straight down              -> no flattening, top-down
  profile: "car_360"

  # Where the road is expected to be, before any pixels are looked at. This
  # seeds road segmentation, so it only has to be roughly right.
  road_prior:
    # -- trapezoid (car views): fractions of frame width/height ---------------
    # bottom_y/top_y bound the road vertically; half widths set the taper.
    bottom_y: 1.0
    top_y: 0.55                # ~horizon; above this is sky/vegetation
    bottom_half_width: 0.48
    top_half_width: 0.12
    center_x: 0.5
    # -- band (drone_nadir) ---------------------------------------------------
    axis: "auto"               # auto | vertical | horizontal (auto: inferred once)
    band_center: 0.5
    band_half_width: 0.30

  # Only used when profile == drone_nadir. Supplying either gsd_m_per_px, or
  # altitude + camera intrinsics, turns defect areas into real m² and unlocks
  # ABSOLUTE severity thresholds instead of clip-relative ones.
  drone:
    gsd_m_per_px: null         # metres per pixel on the ground, if you know it
    altitude_m: null           # AGL flight height
    camera:
      focal_mm: null
      sensor_width_mm: null

# ---------------------------------------------------------------------------
# 0b. GEOMETRY — the calibrated bridge between pixels and the road plane
# ---------------------------------------------------------------------------
# Everything metric depends on this: defect area in m², crack width in mm,
# longitudinal-vs-transverse classification, edge loss, texture at fixed scale.
# A wrong camera height silently rescales every measurement, so measure it.
geometry:
  camera:
    # Intrinsics. Give fx/fy from a checkerboard calibration if you have one;
    # otherwise h_fov_deg is a usable approximation (square pixels, centred
    # principal point). Typical dashcam h_fov is 100-140° (marketing "170°" is
    # usually diagonal, not horizontal).
    fx: null
    fy: null
    cx: null
    cy: null
    h_fov_deg: 78.0
    # Extrinsics. height_m MUST be measured — it scales all ground distances.
    height_m: 1.30                 # camera height above the road surface
    pitch_deg: 5.0                 # downward tilt; > 0 looks toward the road
    yaw_deg: 0.0
    # Dashcams get knocked and remounted, so recover pitch/yaw per clip from the
    # vanishing point rather than trusting the numbers above. Camera HEIGHT cannot
    # be recovered this way — the VP does not depend on it.
    auto_pitch_from_vp: true
    vp_sample_frames: 40
    max_auto_pitch_correction_deg: 12.0

  zones:
    # Assessment zones are DERIVED from the resolution each class needs, not typed
    # in. Outside its zone a class is reported "not assessed" rather than "absent" —
    # a hairline crack at 25 m is below the sampling limit, so finding nothing there
    # is not evidence of intact pavement.
    default_gsd_m: 0.020
    required_gsd_m:                # metres per pixel needed, per class
      pothole: 0.020
      longitudinal_crack: 0.005
      transverse_crack: 0.005
      alligator_crack: 0.008
      edge_damage: 0.020
      ravelling: 0.005
      rutting: 0.015
      drainage_issue: 0.030
      water_logging: 0.030
    min_distance_m: 0              # 0 -> nearest ground actually visible
    max_distance_m: 0              # 0 -> furthest ground actually visible

# ---------------------------------------------------------------------------
# 0c. VALIDITY — refuse to assess frames where the road cannot be seen
# ---------------------------------------------------------------------------
# Two jobs. (1) Honesty: never emit a defect list for a frame where the road is
# buried, unlocatable, or the vehicle is off the carriageway — a reader cannot
# distinguish "inspected and clean" from "never inspected". (2) Precision: most
# false positives come from degraded frames, so this is the cheapest precision
# lever available and the only one needing no training data.
# Tightening these gates raises precision and lowers route coverage. Both numbers
# are reported; a precision figure over an undisclosed subset means nothing.
validity:
  enabled: true

  road_found:
    min_confidence: 0.25           # road mask confidence below this -> block
    min_coverage: 0.04             # road smaller than this fraction of frame -> block
    degrade_on_fallback: true      # prior-only mask is geometry, not observation

  road_buried:
    block_above_frac: 0.60         # water+mud over this much of the road -> block
    degrade_above_frac: 0.25

  plausibility:
    # Catches what road_buried structurally cannot. That gate measures water/mud
    # RELATIVE to the road baseline, so when a contaminant covers the ENTIRE
    # carriageway it becomes the baseline and the road reads as clean and dry.
    # This gate uses absolute appearance to catch that case (see
    # surface.plausibility for the thresholds).
    enabled: true

  off_track:
    # If the vehicle is ON a road, the surface immediately ahead is road. A mask
    # that stops short means we are beside it, or looking at something else.
    bottom_band_frac: 0.08
    min_bottom_fill: 0.12
    max_centre_offset: 0.28        # road this far off centre -> off the travelled way

  egomotion:
    min_flow_px: 0.6               # below this the vehicle is stopped -> block
    block_reverse: true            # flow contracting toward the VP = reversing
    max_yaw_px: 14.0               # sharp turn -> degrade
    max_pitch_px: 10.0             # camera pitching invalidates distances -> degrade
    max_corners: 300
    quality_level: 0.01
    min_distance: 12
    work_width: 480

  traffic:
    # The commonest dashcam occluder is the vehicle ahead. Vehicles are COCO
    # classes, so this needs NO training data.
    enabled: true
    model: "yolo11n.pt"            # small COCO detector, separate from the defect model
    conf: 0.35
    imgsz: 640
    stride: 3                      # detect every N frames; vehicles don't teleport
    dilate_frac: 0.01              # grow boxes to catch under-vehicle contact shadow
    block_above_zone_frac: 0.55    # too little road left -> block the frame

  image:
    max_glare_frac: 0.12           # blown highlights (sun / wet-road flare) -> block
    min_mean_luma: 0.10            # night / tunnel -> block
    degrade_below_luma: 0.18

  windscreen:
    # Dirt, rain spots, wiper arc and the bonnet are FIXED to the camera, so they
    # are perfectly stable false-positive generators that no confidence threshold
    # removes. Found by temporal invariance: real scene content streams past.
    enabled: true
    min_frames: 30                 # motion frames needed before trusting the estimate
    max_temporal_std: 5.0          # below this a pixel never changes -> static
    alpha: 0.08
    work_width: 320
    block_above_frac: 0.35

  zone:
    min_usable_px: 2000            # assessable road remaining after all exclusions

# ---------------------------------------------------------------------------
# 1. INGEST — accept video, detect format, extract telemetry
# ---------------------------------------------------------------------------
ingest:
  # Supported: .mp4 (equirectangular or flat), .insv/.insp (Insta360 dual-fisheye)
  auto_convert_insv: true
  equirect_cache: "data/raw"
  telemetry:
    enabled: true
    sources: ["sidecar_gpx", "sidecar_srt", "embedded"]
    gpx_path: null
    srt_path: null

# ---------------------------------------------------------------------------
# 2. PREPROCESS — 360 -> flat "road camera", ground scale, frame sampling
# ---------------------------------------------------------------------------
preprocess:
  reproject:
    enabled: true                  # ignored for rectilinear viewpoints
    input_projection: "equirect"
    yaw_deg: 0.0                   # forward
    pitch_deg: -30.0               # negative looks down at the road
    roll_deg: 0.0
    h_fov_deg: 110.0
    v_fov_deg: 70.0
    # 'auto' matches the source's real angular detail: an equirect frame carries
    # only src_width * h_fov/360 px across the view, so a smaller output throws
    # detail away and a much larger one just interpolates. Hard numbers are the
    # single most common cause of a soft, "unclear" rectified video.
    out_width: "auto"
    out_height: "auto"
    min_width: 960                 # clamps for 'auto'
    max_width: 3840
    # A gnomonic view has square pixels only when w/h == tan(h_fov/2)/tan(v_fov/2).
    # Leave true unless you deliberately want a stretched view.
    preserve_aspect: true
    interp: "lanczos"
    crf: 18                        # intermediate encode quality (lower = better)
    preset: "medium"
    lossless: false                # true = x264 crf 0; large files, zero loss

  ipm:                             # bird's-eye homography — used for MEASUREMENT
    # Enabling this does not warp the video. It gives per-pixel ground area so
    # defect size is reported in m² instead of pixels (pixel area in a
    # perspective view confounds size with distance).
    enabled: false
    src_points: [[0.20, 1.0], [0.80, 1.0], [0.62, 0.55], [0.38, 0.55]]
    dst_points: [[0.0, 1.0], [1.0, 1.0], [1.0, 0.0], [0.0, 0.0]]
    out_width: 640
    out_height: 960
    # Real-world [width, length] in metres of the src_points trapezoid. Required
    # for m² output — measure it once on site.
    ground_extent_m: null

  sampling:
    # Writes the frames you will LABEL. Switch off for a pure inference run: without
    # GPS this is the most expensive stage in the pipeline, because distance has to be
    # estimated by dense optical flow on every frame.
    enabled: true
    flow_work_width: 480           # downscale before optical flow (>15x cheaper)
    mode: "distance"               # distance | time | every_n
    distance_m: 2.0
    time_s: 0.5
    every_n: 15
    odometry_fallback: "optical_flow"
    flow_units_per_m: 5.0          # optical-flow units per metre (arbitrary scale)
    save_frames: true
    frames_dir: "data/rectified"
    jpeg_quality: 95               # labeling frames: keep compression artifacts low

# ---------------------------------------------------------------------------
# 3. QUALITY — measure the footage, then enhance it consistently
# ---------------------------------------------------------------------------
quality:
  assess:
    enabled: true
    sample_frames: 60              # frames used to learn this clip's distribution
    drop_unusable: true            # skip detection on frames too poor to trust
    # Thresholds are relative to the clip (absolute ones do not transfer between
    # cameras) with an absolute floor as a backstop.
    sharpness_rel_floor: 0.35      # fraction of the clip's median sharpness
    sharpness_abs_floor: 8.0
    min_contrast: 0.04
    max_clipped_high: 0.25         # blown highlights
    max_clipped_low: 0.35          # crushed blacks

  enhance:
    # IMPORTANT: these settings apply to BOTH the saved labeling frames and the
    # frames fed to the detector. Changing them after labeling creates a silent
    # train/serve mismatch — the manifest records a fingerprint so you can tell.
    enabled: true
    adaptive: true                 # nudge settings toward what the clip needs
    white_balance: false           # grey-world; helps strong colour casts
    denoise: "none"                # none | bilateral | nlmeans (nlmeans is slow)
    denoise_strength: 0.4
    clahe_clip: 2.0                # local contrast; the main lever for dull footage
    clahe_grid: 8
    unsharp_amount: 0.6            # recovers softness from resampling
    unsharp_sigma: 1.2
    unsharp_threshold: 3           # skip flat areas so noise is not amplified
    min_width: 0                   # upscale narrower frames; 0 = off
    max_upscale: 2.0

# ---------------------------------------------------------------------------
# 4. ROAD SEGMENTATION — find the drivable surface BEFORE looking for defects
# ---------------------------------------------------------------------------
roadseg:
  # classical : colour+texture similarity seeded by the geometric prior.
  #             Real-time on CPU, no extra deps. Default.
  # geometric : the prior alone. Crude but never fails.
  # sam       : prompt SAM with the prior. Most accurate, very slow on CPU.
  # none      : no road constraint (expect off-road false positives).
  backend: "classical"
  stride: 1                        # recompute every N frames (>1 is much faster)

  classical:
    work_width: 480                # segmentation resolution; masks are upscaled
    distance_tau: 2.5              # similarity cutoff, in robust sigmas
    weights:                       # per-channel importance
      l: 1.0                       # lightness
      a: 1.0                       # LAB green-red
      b: 1.0                       # LAB blue-yellow
      s: 0.7                       # saturation
      tex: 1.3                     # texture: the strongest road/vegetation cue
    texture_ksize: 7
    seed_erode_frac: 0.05          # shrink the prior to get a confident seed
    search_dilate_frac: 0.06       # allow growth slightly beyond the prior
    open_frac: 0.006               # speckle removal
    close_frac: 0.02               # gap bridging
    # Potholes/puddles are appearance outliers INSIDE the road, so they get
    # carved out as holes. Filling them puts the defects back on the road —
    # without this, gating would reject the very things it should keep.
    fill_holes: true
    min_coverage: 0.02             # below this the result is implausible
    max_coverage: 0.95             # above this it has swallowed the whole frame
    min_seed_retention: 0.25       # must keep this much of the confident seed
    # If the similarity test accepts nearly everything it is allowed to, it
    # discriminated nothing and the "mask" is really just the prior. Treated as a
    # fallback so it cannot masquerade as a measurement.
    max_search_fill: 0.98

  temporal:
    # EMA over per-pixel road probability. A flickering road mask breaks defect
    # tracks and inflates unique counts. alpha = weight of the current frame;
    # 1.0 disables smoothing, lower lags more on bends.
    alpha: 0.5
    threshold: 0.5

  sam:
    model: "sam2.1_b.pt"
    n_positive: 5
    n_negative: 4
    seed_erode_frac: 0.05
    search_dilate_frac: 0.06
    min_coverage: 0.02
    max_coverage: 0.95

  gating:
    # gate : keep detections, drop those off the road (safe default)
    # mask : blank non-road pixels before detection — only if you also trained
    #        on masked frames, otherwise it is a domain shift
    # off  : no gating
    mode: "gate"
    min_road_overlap: 0.3          # detection must be this much on the road
    # If the road mask is only a low-confidence guess (geometric fallback),
    # gating on it would discard real defects. Below this confidence, gating
    # is suspended for that frame.
    min_confidence: 0.2

# ---------------------------------------------------------------------------
# 5. SURFACE CONDITION — mud and water are OCCLUDERS, not just classes
# ---------------------------------------------------------------------------
# You cannot inspect a surface you cannot see. Water and mud sit on top of the
# road and hide what is underneath, so this stage builds an occlusion mask and
# the pipeline abstains there rather than reporting "no defect".
# All thresholds are z-scores against the road's OWN measured appearance, since
# absolute colour thresholds do not survive different soils or lighting.
surface:
  enabled: true
  stride: 1                        # recompute every N frames
  texture_ksize: 7

  # Detection uses region-averaged z-scores: the baseline sigma is per-pixel, so
  # ~1/3 of a clean road exceeds 1 sigma on sensor noise alone and raw per-pixel
  # thresholds would flag most of the road. Averaging suppresses that noise.
  region_ksize: 21                 # detection kernel (noise-robust, erodes edges)
  # ...but a large kernel shrinks small patches, and measured AREA drives the
  # headline "% unassessable". So extent is recovered by growing the confident
  # cores into a lightly smoothed map at a relaxed threshold (hysteresis). A
  # relaxed region survives only if it contains a confident core.
  extent_ksize: 7
  extent_threshold_scale: 0.6

  # abstain : flag hidden defects indeterminate, never severity-score them, and
  #           report the unassessable road fraction  (recommended)
  # flag    : score them anyway but mark them
  # exclude : drop them from the report entirely
  occlusion_policy: "abstain"
  occlusion_threshold: 0.5         # fraction of a defect under water/mud to abstain

  # Classes that ARE the occluder — never marked "hidden" by their own mask.
  occluder_classes: ["water_logging"]

  water:
    # Smoothness is mandatory: a water surface is specular and destroys the
    # high-frequency texture of gravel. Then any one supporting cue.
    min_smoother_z: 1.0
    min_brighter_z: 1.0            # sky/sun reflection
    min_desat_z: 1.0               # washed out
    min_darker_z: 1.5              # deep water

  mud:
    # A warm shift in LINEAR-RGB chromaticity is mandatory. Chromaticity is
    # invariant under illumination, so this is what separates wet soil from plain
    # shade — LAB a/b cannot do it, since merely darkening a neutral grey moves
    # them several units purely as a gamma artifact.
    # Wet laterite shifts chromaticity by ~0.3 (>20 sigma), so this threshold has
    # plenty of headroom and is set to reject ordinary surface variation.
    min_warmer_z: 2.5
    min_darker_z: 0.6
    min_smoother_z: 0.5

  shadow:
    # Shadow = less light: brightness drops but chromaticity and
    # brightness-relative texture are preserved. Detected explicitly and excluded,
    # or every patch of shade becomes "mud" and the unassessable figure is junk.
    min_darker_z: 1.0
    # Keeps a *shadowed puddle* detectable as water rather than dismissed as shade.
    max_smoother_z: 0.6
    max_chroma_shift_z: 1.5

  min_blob_area_frac: 0.002        # ignore specks below this fraction of road area
  close_px: 3

  # ABSOLUTE appearance thresholds — the one deliberate exception to the
  # relative-statistics rule above. If the WHOLE road is covered, the covering
  # becomes the baseline and relative detection is blind to it by construction.
  # These catch that case and feed validity.plausibility, which BLOCKS the frame.
  # Never used to grade severity. Set loose on purpose: absolute values transfer
  # poorly between cameras and soil types.
  plausibility:
    # Vegetation -> the vehicle is not on a carriageway at all.
    veg_hue_lo: 35.0               # OpenCV hue scale, 0-179
    veg_hue_hi: 90.0
    veg_min_saturation: 60.0
    veg_min_texture: 6.0
    # Whole surface reads as wet soil.
    mud_min_a: 140.0
    mud_min_b: 145.0
    mud_max_texture: 4.0
    # Whole surface reads as standing water: specular, so texture is gone.
    water_max_texture: 2.0
    water_min_l: 170.0
    water_max_saturation: 25.0

# ---------------------------------------------------------------------------
# 6. ANNOTATE — SAM-assisted labeling helper (not used at inference)
# ---------------------------------------------------------------------------
annotate:
  sam_model: "sam2.1_b.pt"
  frame_picker:
    strategy: "diversity"          # diversity | uncertainty | random
    n_frames: 200
  labels_dir: "data/labels"
  export_format: "yolo_seg"

# ---------------------------------------------------------------------------
# 7. MODEL — YOLO seg, warm-start + fine-tune
# ---------------------------------------------------------------------------
model:
  arch: "yolo26-seg"
  fallback_arch: "yolo11-seg"
  size: "m"
  warm_start_weights: null

  # Translate a checkpoint's OWN class names onto the taxonomy below. Essential for any
  # public checkpoint: detections carry an integer id, so without a map a 5-class
  # RDD2022 model against these 9 classes would label its D00 (longitudinal crack)
  # "pothole" purely because both sit at index 0 - silently, with no error.
  # Map a name to null to drop that class entirely.
  # For huggingface.co/rezzzq/yolo12s-road-damage-rdd2022, uncomment:
  # class_map:
  #   D00: longitudinal_crack
  #   D10: transverse_crack
  #   D20: alligator_crack
  #   D40: pothole
  #   Repair: null            # a past repair, not a defect
  # Set this when running the MP_Road_Annotation_POC fine-tune. The names below are
  # already valid taxonomy names, so the map looks like a no-op — it is not. That
  # checkpoint has 6 classes in ITS own order, and detections resolve positionally, so
  # without the map id 0 ("alligator_crack" there) would be read as "pothole" here and
  # every class in the report would be shifted.
  # class_map:
  #   alligator_crack: alligator_crack
  #   drainage_issue: drainage_issue
  #   longitudinal_crack: longitudinal_crack
  #   pothole: pothole
  #   ravelling: ravelling
  #   edge_damage: edge_damage
  class_map: {}
  # The output taxonomy. The three crack classes are NOT expected from the model —
  # a crack detector (generic `crack`, or RDD2022's D00/D10/D20) is re-measured on
  # the road plane and named by geometry in detect/linear.py, because the model's own
  # longitudinal-vs-transverse split is perspective-confounded.
  # edge_damage, ravelling, rutting and drainage_issue are produced label-free by
  # detect/{boundary,texture}.py rather than by the detector.
  classes:
    - "pothole"
    - "longitudinal_crack"
    - "transverse_crack"
    - "alligator_crack"
    - "ravelling"
    - "edge_damage"
    - "rutting"
    - "drainage_issue"
    - "water_logging"
  train:
    data_yaml: "data/dataset.yaml"
    epochs: 100
    imgsz: 960
    batch: 8
    patience: 20
    split:
      mode: "segment"              # segment | time  (never "random")
      segment_gap_s: 5.0
      ratios: {train: 0.7, val: 0.15, test: 0.15}

# ---------------------------------------------------------------------------
# 7b. DETECT — the four detector families
# ---------------------------------------------------------------------------
# The seven requested categories are four different problems. Mixing them into one
# flat class list caps accuracy on all of them, so each family gets the right tool.
detect:
  conditions_enabled: true
  conditions_stride: 5             # area/boundary conditions every N frames

  tiling:
    # A crack 3 px wide becomes 1.5 px when a 1920-wide frame is letterboxed to
    # imgsz 960 — below the network's stride, so its features are destroyed before
    # the first convolution. Tiling the ROAD REGION at native resolution restores
    # them at a cost proportional to road area, not frame area.
    enabled: false                 # turn on once a crack model is trained
    tile_px: 640
    overlap: 0.25
    max_tiles: 12
    iou_merge: 0.45
    min_road_frac: 0.10

  linear:
    # Cracks are classified by measuring orientation on the ROAD PLANE. In the image,
    # a longitudinal crack's angle depends on where in the frame it falls, so image
    # orientation is not the feature — ground orientation is.
    longitudinal_max_deg: 30.0     # <= this to the road axis -> longitudinal
    transverse_min_deg: 60.0       # >= this -> transverse (between = diagonal, flagged)
    # Alligator is identified by CONNECTIVITY, not appearance: fatigue cracking
    # encloses pavement cells, parallel cracks enclose nothing.
    alligator_min_cells_per_m2: 4.0
    alligator_min_cells: 3
    alligator_max_elongation: 4.0
    min_length_m: 0.15
    min_points: 30

  boundary:
    # Edge damage needs no detector: it IS an irregularity of the road-mask boundary.
    # Measured in METRES on the ground plane — in the image a straight edge converges
    # on the vanishing point, so pixel deviation is dominated by perspective.
    min_inset_m: 0.10              # loss below this is measurement noise
    min_length_m: 0.40
    poly_order: 2                  # straight or gently curving edge baseline
    n_samples: 40
    max_residual_m: 1.2            # worse than this and the mask, not the road, is bad

  texture:
    # Ravelling must be graded at a FIXED GROUND SIZE. A fixed-pixel window grades the
    # near field rough and the far field smooth on every road ever surveyed, purely
    # because of sampling.
    cell_m: 0.5
    min_cell_px: 40
    ravelling_min_z: 1.5           # texture above baseline to call ravelling
    min_cells: 4
    # Rutting: wheel paths sit at predictable offsets. Reported as an INDEX only —
    # a monocular camera cannot measure rut depth, so no depth is ever emitted.
    wheelpath_offset_m: 0.85
    wheelpath_half_width_m: 0.35

  drainage:
    # Culvert identification needs labelled examples (deferred). The SYMPTOM does not:
    # water pooling against the road edge instead of draining away.
    edge_erode_frac: 0.10
    min_pool_px: 250

  confusers:
    # The recurring dashcam look-alikes. Each rule needs several cues to agree —
    # rejecting a real pothole to avoid a tar patch is a bad trade — and every
    # rejection is counted by reason so the filter is auditable.
    enabled: true
    exempt_classes: ["water_logging"]
    shadow_overlap: 0.70           # detection lying in verified shade
    tar_min_darker_z: 1.2          # dark BUT smooth BUT chromatically distinct
    tar_min_smoother_z: 1.5
    tar_min_chroma_z: 1.0
    marking_min_brighter_z: 1.5    # bright, straight, thin, road-aligned
    marking_min_elongation: 6.0
    marking_min_fill: 0.55
    marking_max_angle_deg: 25.0
    manhole_min_circularity: 0.80  # near-circular and smooth
    manhole_min_smoother_z: 0.8
    joint_min_angle_deg: 75.0      # ruler-straight full-width transverse line
    joint_min_elongation: 12.0
    joint_min_fill: 0.70
    joint_max_darker_z: 3.0

# ---------------------------------------------------------------------------
# 7c. EVAL — where the >=90% precision target is proven or disproven
# ---------------------------------------------------------------------------
# Precision is an OPERATING POINT, not a property: every detector traces a
# precision-recall curve, so "90% precision" means choosing a threshold on it. The
# honest deliverable is per-class thresholds plus the recall paid for them.
eval:
  target_precision: 0.90
  # Counting unit is the unique multi-frame-confirmed defect, never a per-frame
  # detection — a number that moves with frame rate is not a quality measure.
  match_slack_frames: 5
  min_support: 8                   # too few ground-truth instances to certify
  # Require the LOWER bound of the confidence interval to clear the target, so a class
  # is not certified on the strength of 9 correct out of 10.
  require_ci_lower_bound: true
  # Classes explicitly outside the guarantee (your call on rutting).
  exclude_from_target: ["rutting"]
  ground_truth: null               # CSV/JSON: class,first_frame,last_frame[,id,lat,lon]

# ---------------------------------------------------------------------------
# 8. DEPTH — OPTIONAL. Adds depth to severity where it is measurable.
# ---------------------------------------------------------------------------
depth:
  enabled: false
  backend: "video_depth_anything"
  metric: true
  model: "vitl"

# ---------------------------------------------------------------------------
# 9. SEVERITY
# ---------------------------------------------------------------------------
severity:
  # With ground scale (drone GSD or IPM ground_extent_m), severity uses ABSOLUTE
  # physical thresholds and is comparable between videos.
  absolute_bins_m2:
    medium: 0.10                   # >= 0.10 m² -> medium
    high: 0.50                     # >= 0.50 m² -> high
  # Without scale it falls back to min-max across the run, which means the
  # biggest defect present is always "high". The report says so explicitly.
  bins: {low: 0.33, medium: 0.66}
  w_area: 0.5                      # weights used only when depth is enabled
  w_depth: 0.5

# ---------------------------------------------------------------------------
# 10. INFERENCE — detect + track + unique count + annotated video
# ---------------------------------------------------------------------------
inference:
  weights: null                    # trained .pt; null -> warm_start / arch default
  conf: 0.25
  iou: 0.5
  imgsz: 960                       # raise toward native width for small cracks
  # SPEED. Detect on every Nth frame. The biggest lever by far, and nearly free in
  # coverage: at 30 fps / 30 km/h the vehicle advances ~28 cm per frame, so consecutive
  # frames re-inspect the same tarmac. Skipped frames are still written to the
  # annotated video, so the output remains a complete record.
  #   1 = every frame (slowest)   3 = a good default for 30 fps   5+ = quick survey
  frame_stride: 1
  half: true                       # fp16 on CUDA; ~2x faster, no visible difference
  log_every: 200                   # progress line every N processed frames
  tracker: "botsort"               # botsort | bytetrack
  tracker_cfg: null
  min_track_len: 3                 # frames a track must persist to count
  render:
    draw_masks: true
    draw_boxes: false
    draw_track_id: true
    draw_road: true                # green wash + outline of the segmented road
    draw_surface: true             # hatched water/mud = unassessable
    road_alpha: 0.18
    surface_alpha: 0.35
    draw_road_outline: true
    running_count_overlay: true
    alpha: 0.45
    fps: null                      # null -> match source
    crf: 18                        # x264 via ffmpeg (replaces low-quality mp4v)
    preset: "medium"

# ---------------------------------------------------------------------------
# 11. REPORT
# ---------------------------------------------------------------------------
report:
  csv: true
  json: true
  format: "html"                   # html | pdf   (pdf needs reportlab)

  irc:
    # IRC/PMGSY-style severity bands, on MEASURED physical quantities rather than a
    # score normalised across whatever happened to be in one clip (which is not
    # convertible to these bands and not comparable between surveys).
    # Config-driven because specifications get revised and authorities adopt variants —
    # align these to whatever document a given contract cites.
    crack_width_mm: {medium: 3.0, high: 6.0}
    pothole_area_m2: {medium: 0.10, high: 0.50}
    area_percent: {medium: 10.0, high: 30.0}
    edge_inset_m: {medium: 0.15, high: 0.30}

  segments:
    # Maintenance is planned per stretch, not per defect, so results roll up into
    # chainage segments. The per-defect CSV stays available underneath.
    enabled: true
    length_m: 100.0
    assumed_speed_mps: 8.0         # used for chainage only when GPS is absent
    # A segment nobody could see is not a sound segment: below this coverage the grade
    # is "indeterminate" regardless of how few defects were found there.
    min_coverage: 0.30
  crops:
    enabled: true
    max_per_class: 6
    pad_px: 15
  map:
    enabled: true                  # only rendered if GPS is present
