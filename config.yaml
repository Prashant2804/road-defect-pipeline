# =============================================================================
# Road Defect Detection Pipeline — configuration
# Every stage reads from this file. Paths are relative to the repo root unless
# absolute. Anything you change here changes pipeline behaviour; no code edits.
# =============================================================================

run:
  name: "default"            # used in output subdir + manifest
  seed: 1337
  device: "auto"             # auto | cuda | cuda:0 | cpu   (auto -> cuda if available else cpu)
  output_dir: "out"          # per-run artifacts go to <output_dir>/<run.name>/

# ---------------------------------------------------------------------------
# 1. INGEST — accept video, detect format, extract telemetry
# ---------------------------------------------------------------------------
ingest:
  # Supported: .mp4 (equirectangular passthrough), .insv/.insp (Insta360 dual-fisheye)
  # If dual-fisheye and auto_convert is true we try FFmpeg v360; otherwise we
  # print the Insta360 Studio export instructions and stop.
  auto_convert_insv: true
  # Where a converted equirectangular mp4 is written (only for .insv/.insp input).
  equirect_cache: "data/raw"
  telemetry:
    enabled: true
    # Search order for GPS. First hit wins. All optional — pipeline runs GPS-less.
    sources: ["sidecar_gpx", "sidecar_srt", "embedded"]   # embedded = ffprobe/exiftool metadata
    # If a sidecar is not next to the video, set an explicit path (or leave null).
    gpx_path: null
    srt_path: null

# ---------------------------------------------------------------------------
# 2. PREPROCESS — 360 -> flat "road camera", optional bird's-eye, frame sampling
# ---------------------------------------------------------------------------
preprocess:
  reproject:
    enabled: true
    input_projection: "equirect"   # equirect | dual_fisheye  (dual_fisheye handled in ingest)
    # Virtual "road camera" pose. Pitch negative = look down at the road ahead.
    yaw_deg: 0.0                    # forward
    pitch_deg: -30.0               # look down toward road surface
    roll_deg: 0.0
    h_fov_deg: 110.0               # horizontal field of view of the flat view
    v_fov_deg: 70.0
    out_width: 1280
    out_height: 720
    interp: "lanczos"              # ffmpeg v360 interp
  ipm:                             # optional bird's-eye / inverse-perspective-map
    enabled: false
    # Homography source/dest points in the *rectilinear* image (fractions of w/h).
    # src = trapezoid on the road plane; dst = rectangle (top-down).
    src_points: [[0.20, 1.0], [0.80, 1.0], [0.62, 0.55], [0.38, 0.55]]
    dst_points: [[0.0, 1.0], [1.0, 1.0], [1.0, 0.0], [0.0, 0.0]]
    out_width: 640
    out_height: 960
  sampling:
    # Sample by DISTANCE traveled to kill redundant near-identical frames.
    mode: "distance"               # distance | time | every_n
    distance_m: 2.0                # sample every N metres (needs GPS or odometry)
    time_s: 0.5                    # used if mode == time
    every_n: 15                    # used if mode == every_n
    odometry_fallback: "optical_flow"   # when GPS absent: optical_flow | none
    save_frames: true
    frames_dir: "data/rectified"

# ---------------------------------------------------------------------------
# 3. ANNOTATE — SAM-assisted labeling helper (not used at inference)
# ---------------------------------------------------------------------------
annotate:
  sam_model: "sam2.1_b.pt"         # ultralytics SAM checkpoint (auto-downloads)
  frame_picker:
    strategy: "diversity"          # diversity | uncertainty | random
    n_frames: 200                  # how many frames to surface for labeling first
  labels_dir: "data/labels"        # YOLO-seg txt exported here
  export_format: "yolo_seg"

# ---------------------------------------------------------------------------
# 4. MODEL — YOLO seg, warm-start + fine-tune
# ---------------------------------------------------------------------------
model:
  # Primary is tried first; if the ultralytics build can't resolve it we fall
  # back to `fallback` automatically and log a warning.
  arch: "yolo26-seg"
  fallback_arch: "yolo11-seg"
  size: "m"                        # n|s|m|l|x  -> e.g. yolo11m-seg.pt
  # Warm-start weights: a road-damage checkpoint to start from BEFORE your labels
  # exist. Can be a local .pt or a URL/Roboflow export. null -> COCO-seg pretrain.
  warm_start_weights: null
  classes: ["pothole", "water_logging", "rut_erosion", "crack"]
  train:
    data_yaml: "data/dataset.yaml" # generated by model/split.py
    epochs: 100
    imgsz: 960
    batch: 8
    patience: 20
    # CRITICAL: never random-split adjacent frames. Split by road segment/time.
    split:
      mode: "segment"              # segment | time  (never "random")
      # A "segment" = a contiguous run of frames (by track/road id or a time gap).
      segment_gap_s: 5.0           # gap larger than this starts a new segment
      ratios: {train: 0.7, val: 0.15, test: 0.15}

# ---------------------------------------------------------------------------
# 5. DEPTH — OPTIONAL. Severity from mask area + estimated depth.
# ---------------------------------------------------------------------------
depth:
  enabled: false
  backend: "video_depth_anything"  # video_depth_anything | yolo_depth
  metric: true                     # metric depth (m) vs relative
  model: "vitl"                    # video-depth-anything encoder
  severity:
    # severity = w_area * norm(mask_area) + w_depth * norm(depth)
    w_area: 0.5
    w_depth: 0.5
    # thresholds -> low/medium/high labels (on the combined 0..1 score)
    bins: {low: 0.33, medium: 0.66}

# ---------------------------------------------------------------------------
# 6. INFERENCE — detect + track + unique count + annotated video
# ---------------------------------------------------------------------------
inference:
  weights: null                    # trained .pt; null -> use warm_start / arch default
  conf: 0.25
  iou: 0.5                         # NMS IoU
  imgsz: 960
  tracker: "botsort"               # botsort | bytetrack
  tracker_cfg: null                # optional custom tracker yaml; null -> ultralytics default
  min_track_len: 3                 # a track must persist >= N frames to count as a real defect
  render:
    draw_masks: true
    draw_boxes: false
    draw_track_id: true
    running_count_overlay: true    # live unique-count HUD in the annotated video
    alpha: 0.45                    # mask fill opacity
    fps: null                      # null -> match source

# ---------------------------------------------------------------------------
# 7. REPORT
# ---------------------------------------------------------------------------
report:
  csv: true
  json: true
  format: "html"                   # html | pdf   (pdf needs reportlab/weasyprint)
  crops:
    enabled: true
    max_per_class: 6               # sample annotated crops embedded in the report
  map:
    enabled: true                  # only rendered if GPS is present
